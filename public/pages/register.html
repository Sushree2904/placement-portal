<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PlacementHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a2a4a, #0d6efd); min-height: 100vh; display: flex; align-items: center; padding: 40px 0; }
        .card { border-radius: 20px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .role-option { cursor: pointer; border: 2px solid #dee2e6; border-radius: 10px; padding: 12px; transition: all 0.2s; }
        .role-option.selected { border-color: #0d6efd; background: #f0f5ff; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="text-center mb-4">
                <h3 class="text-white fw-bold"><i class="bi bi-mortarboard-fill me-2"></i>PlacementHub</h3>
            </div>
            <div class="card p-4">
                <h5 class="fw-bold mb-1">Create your account</h5>
                <p class="text-muted small mb-4">Join the campus placement network</p>
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">I am a...</label>
                        <div class="d-flex gap-3">
                            <div class="role-option flex-fill text-center selected" id="roleStudent" onclick="selectRole('student')">
                                <i class="bi bi-person-graduation d-block fs-4 text-primary mb-1"></i>
                                <span class="fw-semibold small">Student</span>
                            </div>
                            <div class="role-option flex-fill text-center" id="roleCompany" onclick="selectRole('company')">
                                <i class="bi bi-building d-block fs-4 text-success mb-1"></i>
                                <span class="fw-semibold small">Company</span>
                            </div>
                        </div>
                        <input type="hidden" name="role" id="roleInput" value="student">
                    </div>
                    <div class="mb-3" id="companyNameField" style="display:none">
                        <label class="form-label fw-semibold">Company Name</label>
                        <input type="text" name="company_name" class="form-control" placeholder="e.g. Tata Consultancy Services">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Your full name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
                </form>
                <p class="text-center text-muted mt-3 mb-0">
                    Already have an account? <a href="/login" class="text-primary fw-semibold">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="/js/auth.js"></script>
<script>
function selectRole(role) {
    document.getElementById('roleInput').value = role;
    document.getElementById('roleStudent').classList.toggle('selected', role === 'student');
    document.getElementById('roleCompany').classList.toggle('selected', role === 'company');
    document.getElementById('companyNameField').style.display = role === 'company' ? 'block' : 'none';
}
</script>
</body>
</html>
