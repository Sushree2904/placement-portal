<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PlacementHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a2a4a, #0d6efd); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <h3 class="text-white fw-bold"><i class="bi bi-mortarboard-fill me-2"></i>PlacementHub</h3>
            </div>
            <div class="card p-4">
                <h5 class="fw-bold mb-1">Welcome back</h5>
                <p class="text-muted small mb-4">Login to your account</p>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
                </form>
                <p class="text-center text-muted mt-3 mb-0">
                    Don't have an account? <a href="/register" class="text-primary fw-semibold">Register</a>
                </p>
                <hr>
                <p class="text-center text-muted small mb-0">
                    <!-- <strong>Demo Admin:</strong> admin@portal.com / admin123 -->
                </p>
            </div>
        </div>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="/js/auth.js"></script>
</body>
</html>
